name: Deploy to WordPress.org

on:
  push:
    tags: ['*']
  # Lets you exercise the build without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing a tag supersedes the run already going for it, rather than
# racing it to publish the same release.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: New tag release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A mismatch ships a release named for the tag around a plugin that
      # reports the older version. Fail here rather than warn: nobody reads
      # a warning in a green run, and the fix (bump ramadan.php, move the
      # tag) is only cheap before publishing.
      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^ \* Version: \(.*\)$/\1/p' ramadan.php | head -1)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ramadan.php version ${version}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: WordPress Plugin Deploy
        if: startsWith(github.ref, 'refs/tags/')
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: ramadan
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}

      - name: Build distribution zip
        run: npm run plugin-zip

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -f SHA256SUMS
          sha256sum ramadan.zip > SHA256SUMS

      # Idempotent, so a re-run or a re-pushed tag refreshes the assets of
      # the existing release instead of failing on "release already exists".
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "updating the existing $GITHUB_REF_NAME release"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" ramadan.zip SHA256SUMS --clobber
